name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Served from the site root when there is a custom domain (the CNAME file) or the repo is
      # named <owner>.github.io; any other repo is served from /<repo>/
      - name: Work out the base path
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -f apps/portfolio/public/CNAME ]; then
            echo "BASE_PATH=" >> "$GITHUB_ENV"
          else
            case "$repo" in
              *.github.io) echo "BASE_PATH=" >> "$GITHUB_ENV" ;;
              *) echo "BASE_PATH=/$repo" >> "$GITHUB_ENV" ;;
            esac
          fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
